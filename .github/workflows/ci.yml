name: Verify and deploy FORM
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Tests, types and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm --prefix mobile ci
      - run: npm test
      - run: npm run test:roles
      - run: npm run test:access
      - run: npm run lint
      - run: npm run typecheck
      - run: npm --prefix mobile run typecheck
      - run: npm run build
      - run: npm run cloudflare:check
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  deploy:
    # Every merge to main ships the development build to the team's Cloudflare
    # Worker once the checks pass. Feature branches and pull requests never
    # receive credentials. The job explains what is missing instead of failing
    # when the repository has not been configured yet (see docs/DEPLOYMENT.md).
    name: Deploy development to Cloudflare
    needs: checks
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
      url: ${{ steps.publish.outputs.url }}
    concurrency:
      group: form-cloudflare-development
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      FORM_D1_DATABASE_ID: ${{ vars.FORM_D1_DATABASE_ID }}
      FORM_R2_BUCKET: ${{ vars.FORM_R2_BUCKET }}
      FORM_ACCESS_TEAM_DOMAIN: ${{ vars.FORM_ACCESS_TEAM_DOMAIN }}
      FORM_ACCESS_AUD: ${{ vars.FORM_ACCESS_AUD }}
      FORM_WORKER_NAME: ${{ vars.FORM_WORKER_NAME || 'form-dev' }}
      # The development site lets every developer preview the app as fixture trainees.
      FORM_PREVIEW_ROLES: 'true'
    steps:
      - name: Check the deployment configuration
        id: config
        run: |
          missing=""
          test -n "$CLOUDFLARE_API_TOKEN" || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          for name in CLOUDFLARE_ACCOUNT_ID FORM_D1_DATABASE_ID FORM_R2_BUCKET FORM_ACCESS_TEAM_DOMAIN FORM_ACCESS_AUD; do
            test -n "${!name}" || missing="$missing $name(variable)"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deployment skipped::Configure the development environment first. Missing:$missing. See docs/DEPLOYMENT.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.config.outputs.ready == 'true'
      - run: npm --prefix mobile ci
        if: steps.config.outputs.ready == 'true'
      - run: npm run cloudflare:configure
        if: steps.config.outputs.ready == 'true'
      - run: npm run build:cloudflare
        if: steps.config.outputs.ready == 'true'
      - name: Apply reviewed migrations
        if: steps.config.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote --config .cloudflare/wrangler.json
      - name: Deploy the Worker and assets
        id: publish
        if: steps.config.outputs.ready == 'true'
        run: |
          npx wrangler deploy --config dist/server/wrangler.json | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $FORM_WORKER_NAME to ${url:-Cloudflare}"
