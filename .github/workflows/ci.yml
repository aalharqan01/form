name: Verify and deploy FORM
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Tests, types and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:roles
      - run: npm run test:access
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run cloudflare:check
      - run: npm --prefix mobile ci
      - run: npm --prefix mobile run typecheck
      - run: npm --prefix mobile run export:web
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  deploy:
    name: Deploy protected Cloudflare staging
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FORM_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: form-cloudflare-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      FORM_D1_DATABASE_ID: ${{ vars.FORM_D1_DATABASE_ID }}
      FORM_R2_BUCKET: ${{ vars.FORM_R2_BUCKET }}
      FORM_ACCESS_TEAM_DOMAIN: ${{ vars.FORM_ACCESS_TEAM_DOMAIN }}
      FORM_ACCESS_AUD: ${{ vars.FORM_ACCESS_AUD }}
      FORM_WORKER_NAME: form-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify deployment credentials are configured
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm run cloudflare:configure
      - run: npm run build:cloudflare
      - name: Apply reviewed migrations to staging
        run: npx wrangler d1 migrations apply DB --remote --config .cloudflare/wrangler.json
      - name: Deploy the validated Worker and assets
        run: npx wrangler deploy --config dist/server/wrangler.json
